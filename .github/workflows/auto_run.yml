name: Run Stock Data Fetcher

on:
  schedule:
    - cron: '0 23 * * *'  # Chạy lúc 6h sáng giờ VN
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        run: python <tên-file-của-bạn>.py
